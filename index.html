<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แมวทายใจ (Cat Oracle) 🐾</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Tahoma', sans-serif;
            background-color: #fdf6ec;
            background-image: radial-gradient(#f3d5b5 1px, transparent 1px);
            background-size: 16px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #4a4a4a;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 28px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.3);
            text-align: center;
            max-width: 380px;
            width: 90%;
            position: relative;
        }
        h1 { font-size: 1.3rem; color: #ff6b81; margin-bottom: 8px; }
        p { font-size: 0.85rem; color: #7f8c8d; margin-top: 0; }
        
        .options-grid { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .option-btn {
            background: #fff5f6;
            border: 2px solid #ffe0e6;
            border-radius: 18px;
            padding: 12px 16px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .option-btn:hover { background: #ffe3e8; border-color: #ffb6c1; }
        .emoji-set { font-size: 1.4rem; }

        .modal-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 28px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }
        .mode-btn {
            width: 100%; padding: 12px; margin: 6px 0; border: none;
            border-radius: 14px; background: #fff0f3; color: #ff5252;
            font-weight: bold; cursor: pointer; font-size: 0.85rem;
            border: 1px solid #ffccd5;
        }
        .mode-btn:hover { background: #ffccd5; }

        .id-card-wrapper {
            background: #fff;
            border: 2px dashed #ffb6c1;
            border-radius: 20px;
            padding: 18px;
            margin: 15px 0;
            position: relative;
            text-align: left;
        }
        .mode-badge {
            display: inline-block;
            background: #ffe3e8;
            color: #ff4757;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 10px;
        }
        .id-header { font-size: 0.65rem; color: #b2bec3; font-weight: bold; letter-spacing: 1px; float: right; }
        .id-avatar-box { text-align: center; margin: 10px 0; }
        .id-avatar { font-size: 3.5rem; }
        .id-title { font-size: 1.1rem; font-weight: bold; color: #2d3436; text-align: center; margin-bottom: 10px; }
        
        .tags { display: flex; justify-content: center; gap: 5px; margin-bottom: 10px; }
        .tag { background: #ffeaa7; color: #d63031; font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; font-weight: bold; }

        .id-desc {
            font-size: 0.85rem; color: #636e72; line-height: 1.5;
            background: #fdf6ec; padding: 12px; border-radius: 12px;
        }
        .extra-info {
            background: #fff0f3; padding: 8px 12px; border-radius: 10px;
            font-size: 0.8rem; color: #d63031; margin-top: 8px; font-weight: bold;
            text-align: center;
        }

        .stamp {
            display: none;
            position: absolute;
            bottom: 15px; right: 15px;
            border: 2px solid #ff4757; color: #ff4757;
            font-size: 0.75rem; font-weight: bold;
            padding: 4px 10px; border-radius: 8px;
            transform: rotate(-12deg); background: rgba(255,255,255,0.9);
        }

        .feed-box { background: #fff5f6; border-radius: 16px; padding: 12px; margin-top: 10px; }
        .feed-status { font-size: 0.85rem; color: #ff6b81; font-weight: bold; margin-bottom: 8px; }
        
        .btn-group { display: flex; gap: 8px; margin-top: 10px; }
        .action-btn {
            flex: 1; border: none; padding: 10px; border-radius: 12px;
            font-weight: bold; cursor: pointer; font-size: 0.85rem; transition: 0.2s;
        }
        .btn-feed { background: #ffeaa7; color: #d63031; width: 100%; padding: 12px; font-size: 0.95rem; }
        .btn-feed:disabled { background: #dfe6e9; color: #b2bec3; cursor: not-allowed; }
        .btn-download { background: #55efc4; color: #00b894; display: none; width: 100%; padding: 12px; margin-top: 5px; font-size: 0.95rem; }
        .btn-change { background: #ff7675; color: white; }
        .btn-reset { background: #dfe6e9; color: #636e72; }

        .fish-particle {
            position: fixed; font-size: 2rem; pointer-events: none;
            animation: floatUp 1.2s ease-out forwards; z-index: 999;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- สเต็ป 1: เลือกอีโมจิ -->
        <div id="quiz-section">
            <h1>🔮 แมวทายใจ (Cat Oracle)</h1>
            <p>เลือกเซ็ตอีโมจิ เพื่ออัญเชิญร่างแม่หมอแมวประจำตัวคุณ</p>
            <div class="options-grid">
                <button class="option-btn" onclick="selectEmoji(0)">
                    <span class="emoji-set">🌙 ☕ 📚</span><span>เซ็ต A</span>
                </button>
                <button class="option-btn" onclick="selectEmoji(1)">
                    <span class="emoji-set">🎨 🎧 🚀</span><span>เซ็ต B</span>
                </button>
                <button class="option-btn" onclick="selectEmoji(2)">
                    <span class="emoji-set">🌊 🌿 🛋️</span><span>เซ็ต C</span>
                </button>
                <button class="option-btn" onclick="selectEmoji(3)">
                    <span class="emoji-set">🔥 🏆 🍕</span><span>เซ็ต D</span>
                </button>
            </div>
        </div>

        <!-- Pop-up เลือกแนวทำนาย -->
        <div class="modal-overlay" id="mode-modal">
            <h3 style="margin-top:0; color:#ff6b81;">เลือกแนวคำทำนายจากแมว 🐾</h3>
            <button class="mode-btn" onclick="generateOracle(1)">1. Cat Archetype (ตัวตนแมวของคุณ)</button>
            <button class="mode-btn" onclick="generateOracle(2)">2. Cat Oracle Card (คำทำนายแม่หมอ)</button>
            <button class="mode-btn" onclick="generateOracle(3)">3. Emoji Translator (แมวแปลอีโมจิ)</button>
        </div>

        <!-- สเต็ป 2: แสดงบัตรสแกนตัวตนแมว -->
        <div id="result-section" style="display: none;">
            
            <div class="id-card-wrapper" id="cat-card">
                <span class="id-header">OFFICIAL CAT ID</span>
                <span class="mode-badge" id="mode-badge">Mode 1: Archetype</span>
                
                <div class="id-avatar-box">
                    <div class="id-avatar" id="cat-avatar">🃏⚡</div>
                </div>

                <div class="id-title" id="cat-title">กำลังโหลด...</div>
                
                <div class="tags" id="cat-tags"></div>

                <div class="id-desc" id="cat-desc">...</div>

                <div class="extra-info" id="extra-info">...</div>

                <div class="stamp" id="cleared-stamp">✔ แก้เคล็ดแล้ว 🐟</div>
            </div>

            <!-- โซนภารกิจให้อาหารแมว -->
            <div class="feed-box">
                <div class="feed-status" id="feed-status-text">ต้องให้อาหารแก้เคล็ดอีก 0 ครั้ง 🐟</div>
                <button class="action-btn btn-feed" id="feed-btn" onclick="feedCat()">🐟 ให้อาหารแมวแก้เคล็ด!</button>
                <button class="action-btn btn-download" id="download-btn" onclick="downloadCard()">📸 เซฟบัตรลงเครื่อง</button>
            </div>

            <!-- ปุ่มเปลี่ยนแนว/สุ่มใหม่ -->
            <div class="btn-group">
                <button class="action-btn btn-change" onclick="openModeModal()">🔀 เปลี่ยนแนวทำนาย</button>
                <button class="action-btn btn-reset" onclick="resetQuiz()">🔄 สุ่มอารมณ์ใหม่</button>
            </div>
        </div>
    </div>

    <script>
        let selectedIndex = 0;
        let currentFeedCount = 0;
        let requiredFeedCount = 3; // จำนวนที่จะถูกสุ่มในแต่ละคำทำนาย

        const catData = [
            {
                avatar: "🐈‍⬛",
                mode1: { badge: "Mode 1: Cat Archetype", title: "ร่างแมวส้มผู้ปลีกวิเวก", tags: ["#เซฟโซน", "#อย่าเพิ่งทัก"], desc: "คุณต้องการพื้นที่ส่วนตัวขั้นสุด มนุษย์คนไหนเข้าหาช่วงนี้แนะนำให้ขู่ฟ่อแล้วเดินหนีไปนอนเงียบๆ", extra: "✨ เลขมงคล: 04" },
                mode2: { badge: "Mode 2: Cat Oracle Card", title: "ดวงฟันฝ่าอุปสรรค", tags: ["#ไม่มีอะไรขวางได้", "#ชนะทุกดราม่า"], desc: "ถ้ามีใครมาหาเรื่องหรือมีปัญหาเข้ามาปะทะ ไม่ต้องกลัว! ความเปรี้ยวและความฉลาดของคุณจะเอาชนะได้ทุกสถานการณ์", extra: "✨ เลขมงคลสแกน: 88" },
                mode3: { badge: "Mode 3: Emoji Translator", title: "ร่างแมวก้อนขนเหน็ดเหนื่อย", tags: ["#หมดแพชชัน", "#อยากนอน"], desc: "อีโมจิที่คุณเลือก แมวแปลได้ว่า 'มนุษย์คนนี้เหนื่อยกับโลกภายนอกจนอยากเปลี่ยนร่างเป็นก้อนขนแล้ว'", extra: "✨ เลขมงคล: 00" }
            },
            {
                avatar: "😼⚡",
                mode1: { badge: "Mode 1: Cat Archetype", title: "ร่างแมวเปรี้ยวสายบวก", tags: ["#ตัวตึง", "#คึกตอนตี3"], desc: "พลังงานครีเอทีฟเต็มเปี่ยม พร้อมจะไปตบชามน้ำพลิกหรือวิ่งคึกรอบบ้านได้ตลอดเวลา!", extra: "✨ เลขมงคล: 77" },
                mode2: { badge: "Mode 2: Cat Oracle Card", title: "ดวงไอเดียพุ่งกระฉูด", tags: ["#คิดใหญ่", "#เริ่มเลย"], desc: "อยากทำอะไรให้ลุยเลย แต่ถ้ารู้สึกเบื่อเมื่อไหร่ ให้ฝนเล็บใส่โซฟาเพื่อระบายอารมณ์", extra: "✨ เลขมงคลสแกน: 39" },
                mode3: { badge: "Mode 3: Emoji Translator", title: "ร่างแมวสมองไวแต่กายใจนิ่ง", tags: ["#เพ้อฝัน", "#โปรเจกต์ล้านแปด"], desc: "แปลได้ว่า 'สมองของคุณกำลังวิ่งเร็วเป็นร้อยไมล์ต่อชั่วโมง แต่ร่างกายยังนิ่งเป็นก้อนหิน'", extra: "✨ เลขมงคล: 12" }
            }
        ];

        function playMeowSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.3);
            } catch(e) {}
        }

        function selectEmoji(index) {
            selectedIndex = index % catData.length;
            openModeModal();
        }

        function openModeModal() {
            document.getElementById("mode-modal").style.display = "flex";
        }

        function generateOracle(mode) {
            document.getElementById("mode-modal").style.display = "none";
            document.getElementById("quiz-section").style.display = "none";
            document.getElementById("result-section").style.display = "block";

            playMeowSound();

            // สุ่มจำนวนปลาทูแก้เคล็ด (1 ถึง 5 ตัว)
            requiredFeedCount = Math.floor(Math.random() * 5) + 1;
            currentFeedCount = 0;

            // รีเซ็ตปุ่มและสถานะการแก้เคล็ด
            document.getElementById("cleared-stamp").style.display = "none";
            document.getElementById("download-btn").style.display = "none";
            document.getElementById("feed-btn").style.display = "block";
            document.getElementById("feed-btn").disabled = false;
            
            updateFeedStatusText();

            const currentCat = catData[selectedIndex];
            const data = currentCat['mode' + mode];

            document.getElementById("mode-badge").innerText = data.badge;
            document.getElementById("cat-avatar").innerText = currentCat.avatar;
            document.getElementById("cat-title").innerText = data.title;
            document.getElementById("cat-desc").innerText = data.desc;
            document.getElementById("extra-info").innerText = `${data.extra}  |  🐟 แก้เคล็ด: ถวายปลาทู ${requiredFeedCount} ตัว`;

            const tagsContainer = document.getElementById("cat-tags");
            tagsContainer.innerHTML = data.tags.map(t => `<span class="tag">${t}</span>`).join('');

            confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });
        }

        function updateFeedStatusText() {
            const remaining = requiredFeedCount - currentFeedCount;
            if (remaining > 0) {
                document.getElementById("feed-status-text").innerText = `คำทำนายนี้ต้องให้อาหารแก้เคล็ดอีก ${remaining} ครั้ง! 🐟`;
            } else {
                document.getElementById("feed-status-text").innerText = `🎉 ถวายปลาทูครบแล้ว! แก้เคล็ดสำเร็จ`;
            }
        }

        function feedCat() {
            if (currentFeedCount < requiredFeedCount) {
                currentFeedCount += 1;
                playMeowSound();
                updateFeedStatusText();

                // เอฟเฟกต์ปลาทูเด้ง
                for (let i = 0; i < 4; i++) {
                    const fish = document.createElement("div");
                    fish.className = "fish-particle";
                    fish.innerText = ["🐟", "🥫", "🐾"][Math.floor(Math.random() * 3)];
                    fish.style.left = Math.random() * 80 + 10 + "vw";
                    fish.style.top = "80vh";
                    document.body.appendChild(fish);
                    setTimeout(() => fish.remove(), 1200);
                }

                // เมื่อกดให้อาหารครบตามกำหนด
                if (currentFeedCount >= requiredFeedCount) {
                    document.getElementById("cleared-stamp").style.display = "block";
                    document.getElementById("feed-btn").style.display = "none"; // ซ่อนปุ่มปลาทู
                    document.getElementById("download-btn").style.display = "block"; // แสดงปุ่มดาวน์โหลดรูปภาพ
                    confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
                }
            }
        }

        function downloadCard() {
            const cardElement = document.getElementById("cat-card");
            html2canvas(cardElement, { scale: 2, backgroundColor: null }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Cat-Oracle-ID.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        function resetQuiz() {
            document.getElementById("result-section").style.display = "none";
            document.getElementById("quiz-section").style.display = "block";
        }
    </script>
</body>
</html>
